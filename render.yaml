# Public technical beta. The free database expires after 30 days.
services:
  - type: web
    name: pulse-commuter-beta
    runtime: docker
    plan: free
    region: frankfurt
    repo: https://github.com/Shoxx1211/Mzansipass
    branch: pulse-mvp-integration
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    envVars:
      - key: VITE_MAPBOX_TOKEN
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pulse-commuter-beta-db
          property: connectionString
      - key: PULSE_COOKIE_SECURE
        value: "true"
      - key: PULSE_BOOTSTRAP_DB
        value: "0"
      - key: PULSE_ENABLE_PAYMENT_ROUTES
        value: "false"
databases:
  - name: pulse-commuter-beta-db
    plan: free
    region: frankfurt
    ipAllowList: []

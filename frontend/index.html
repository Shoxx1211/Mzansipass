<!DOCTYPE html>
<html lang="en-ZA">
  <head>
    <meta charset="UTF-8" />

    <!-- ======================================================
         PULSE TRANSIT
         Premium mobile-first commuter intelligence
    ====================================================== -->

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <meta
      name="format-detection"
      content="telephone=no"
    />

    <meta
      name="color-scheme"
      content="dark"
    />

    <!-- ======================================================
         PRIMARY METADATA
    ====================================================== -->

    <title>
      Pulse Transit — Smarter Commuting in South Africa
    </title>

    <meta
      name="description"
      content="Pulse Transit helps South African commuters plan journeys, understand public transport options, track trips and make better-informed travel decisions."
    />

    <meta
      name="keywords"
      content="Pulse Transit, South Africa transport, commuter app, public transport, Gautrain, Rea Vaya, A Re Yeng, Metrorail, minibus taxi, trip planner"
    />

    <meta
      name="author"
      content="Pulse Transit"
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <meta
      name="application-name"
      content="Pulse Transit"
    />

    <!-- ======================================================
         THEME / BROWSER CHROME
    ====================================================== -->

    <meta
      name="theme-color"
      content="#040816"
    />

    <meta
      name="msapplication-TileColor"
      content="#040816"
    />

    <meta
      name="mobile-web-app-capable"
      content="yes"
    />

    <!-- ======================================================
         APPLE / iOS
    ====================================================== -->

    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="Pulse"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <link
      rel="apple-touch-icon"
      href="/apple-touch-icon.png"
    />

    <!-- ======================================================
         FAVICON
    ====================================================== -->

    <link
      rel="icon"
      href="/favicon.ico"
    />

    <!-- ======================================================
         OPEN GRAPH
    ====================================================== -->

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="Pulse Transit"
    />

    <meta
      property="og:title"
      content="Pulse Transit — Smarter Commuting"
    />

    <meta
      property="og:description"
      content="Plan journeys and understand South African public transport with evidence-aware commuter intelligence."
    />

    <meta
      property="og:url"
      content="https://pulse-transit.app/"
    />

    <meta
      property="og:image"
      content="https://pulse-transit.app/og-image.png"
    />

    <meta
      property="og:image:alt"
      content="Pulse Transit"
    />

    <meta
      property="og:locale"
      content="en_ZA"
    />

    <!-- ======================================================
         X / TWITTER
    ====================================================== -->

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Pulse Transit — Smarter Commuting"
    />

    <meta
      name="twitter:description"
      content="Evidence-aware commuter intelligence for South African public transport."
    />

    <meta
      name="twitter:image"
      content="https://pulse-transit.app/og-image.png"
    />

    <!-- ======================================================
         CONNECTION HINTS

         Only services Pulse genuinely uses are listed here.
         No Google Analytics or Google Fonts connection is
         opened unless the application actually needs it.
    ====================================================== -->

    <link
      rel="preconnect"
      href="https://api.mapbox.com"
      crossorigin
    />

    <link
      rel="dns-prefetch"
      href="https://api.mapbox.com"
    />

    <!-- ======================================================
         FIRST-PAINT PROTECTION

         Prevents the browser from briefly displaying a white
         page before React and Tailwind initialise.
    ====================================================== -->

    <style>
      :root {
        color-scheme: dark;
        background: #040816;
      }

      html,
      body,
      #root {
        width: 100%;
        min-width: 100%;
        min-height: 100%;
        margin: 0;
      }

      html {
        background: #040816;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        overflow-x: hidden;
        background:
          radial-gradient(
            circle at 20% 0%,
            rgba(59, 130, 246, 0.13),
            transparent 34rem
          ),
          radial-gradient(
            circle at 85% 15%,
            rgba(34, 211, 238, 0.08),
            transparent 30rem
          ),
          #040816;
        margin: 0;
      }

      #root {
        min-height: 100vh;
        min-height: 100dvh;
      }

      .pulse-boot {
        box-sizing: border-box;
        display: flex;
        min-height: 100vh;
        min-height: 100dvh;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      .pulse-boot__content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }

      .pulse-boot__mark {
        display: grid;
        width: 58px;
        height: 58px;
        place-items: center;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        background:
          linear-gradient(
            145deg,
            rgba(34, 211, 238, 0.16),
            rgba(59, 130, 246, 0.1)
          );
        box-shadow:
          0 20px 60px rgba(0, 0, 0, 0.28),
          inset 0 1px rgba(255, 255, 255, 0.08);
        color: rgba(207, 250, 254, 0.96);
        font-size: 17px;
        font-weight: 900;
        letter-spacing: 0.08em;
      }

      .pulse-boot__name {
        margin: 0;
        color: rgba(255, 255, 255, 0.92);
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 0.02em;
      }

      .pulse-boot__status {
        margin: -10px 0 0;
        color: rgba(255, 255, 255, 0.34);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .pulse-boot__indicator {
        position: relative;
        width: 120px;
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.07);
      }

      .pulse-boot__indicator::after {
        position: absolute;
        inset: 0;
        width: 42%;
        border-radius: inherit;
        background: linear-gradient(
          90deg,
          rgba(34, 211, 238, 0.25),
          rgba(34, 211, 238, 0.95),
          rgba(52, 211, 153, 0.65)
        );
        content: "";
        animation: pulse-boot-loading 1.25s
          cubic-bezier(0.4, 0, 0.2, 1)
          infinite;
      }

      @keyframes pulse-boot-loading {
        from {
          transform: translateX(-120%);
        }

        to {
          transform: translateX(285%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .pulse-boot__indicator::after {
          width: 100%;
          animation: none;
          opacity: 0.75;
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <!--
        Lightweight first-paint state.
        React replaces this as soon as Pulse mounts.
      -->
      <div
        class="pulse-boot"
        role="status"
        aria-label="Loading Pulse Transit"
      >
        <div class="pulse-boot__content">
          <div
            class="pulse-boot__mark"
            aria-hidden="true"
          >
            P
          </div>

          <p class="pulse-boot__name">
            Pulse Transit
          </p>

          <p class="pulse-boot__status">
            Preparing your journey
          </p>

          <div
            class="pulse-boot__indicator"
            aria-hidden="true"
          ></div>
        </div>
      </div>
    </div>

    <noscript>
      Pulse Transit requires JavaScript to run.
      Please enable JavaScript in your browser.
    </noscript>

    <!--
      Vite application entry.

      There is intentionally NO manual service-worker
      registration in this file.

      vite-plugin-pwa owns production service-worker
      generation and registration.
    -->
    <script
      type="module"
      src="/src/index.tsx"
    ></script>
  </body>
</html>

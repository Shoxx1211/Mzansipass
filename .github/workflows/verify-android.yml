name: Verify Pulse Android

on:
  push:
    branches:
      - pulse-mvp-integration
  workflow_dispatch:

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify Android place-search configuration
        shell: bash
        run: |
          case "$VITE_MAPBOX_TOKEN" in
            pk.*) echo "Mapbox public token available for Android place search." ;;
            *) echo "::error::Set the GitHub Actions secret VITE_MAPBOX_TOKEN to the same public pk. token used by the Render beta."; exit 1 ;;
          esac

      - name: Build Pulse frontend
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build Android debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Pulse debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pulse-background-tracking-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

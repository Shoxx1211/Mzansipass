name: Pulse technical-beta checks

on:
  push:
    branches: [pulse-mvp-integration]
  pull_request:
    branches: [pulse-mvp-integration]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Planner, journeys and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npx vitest run tests/multimodalJourney.test.ts
      - run: npm run build

  passenger-auth:
    name: Server-authentication acceptance
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MzansiPass-fullstack/backend
    env:
      # Deliberately synthetic CI-only secrets; never use on public servers.
      SECRET_KEY: ci_app_test_only_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      JWT_SECRET_KEY: ci_jwt_test_only_bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      DATABASE_URL: "sqlite://"
      PULSE_COOKIE_SECURE: "false"
      PULSE_BOOTSTRAP_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: MzansiPass-fullstack/backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
